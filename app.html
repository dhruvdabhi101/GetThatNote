<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GetThatNote</title>
<style>
/* ============================================================
   GetThatNote — single-file clone of antinote.io
   Theme tokens are set on :root by JS (applyTheme)
   ============================================================ */
:root{
  --bg:#f7f6f2;--fg:#2b2a28;--muted:#9a978f;--accent:#2d7ff9;--var:#2d7ff9;--colon:#e0443e;--res:#e09a2a;
  --link:#d6336c;--sel:#ffd3a6;--comment:#a7a49c;--heading:#2b2a28;--bar:#f0efea;--barfg:#6f6c64;--paper:#000;--paperA:.06;
  --cursor:#2b2a28;--check:#2d7ff9;--hl:#ffe16b;--codebg:rgba(0,0,0,.05);--border:rgba(0,0,0,.08);--edge:transparent;
  --font:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;--fs:15px;--lh:1.72;--pad:34px;--radius:14px;--bgA:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:transparent}
body{font-family:var(--font);font-size:var(--fs);color:var(--fg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::selection{background:var(--sel);color:inherit}
#app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;
  background:rgba(var(--bgRGB),var(--bgA));transition:background .25s}
#app.native{border-radius:0}
#app::after{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--edge);pointer-events:none;z-index:5}

/* ---------- top bar (hover reveal) ---------- */
#top{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:2px;padding:0 10px;z-index:30;
  opacity:0;transition:opacity .18s;background:linear-gradient(rgba(var(--bgRGB),.95),rgba(var(--bgRGB),0));}
#top.show,#app:hover #top,#top:focus-within{opacity:1}
#top.drag{cursor:default}
#top .spacer{flex:1}
.ib{width:30px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--barfg);opacity:.8}
.ib:hover{background:var(--codebg);opacity:1;color:var(--fg)}
.ib.on{color:var(--accent);opacity:1}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:.25}}
#navcount{font-size:11px;color:var(--barfg);min-width:46px;text-align:center;letter-spacing:.3px}

/* ---------- editor area ---------- */
#main{flex:1;position:relative;display:flex;min-height:0}
.pane{flex:1;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#main.split .pane+.pane{border-left:1px solid var(--border)}
#main.split.h{flex-direction:column}
#main.split.h .pane+.pane{border-left:0;border-top:1px solid var(--border)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:auto}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* Size the paper to the full note, not just the scroll viewport. */
.sheet{position:relative;min-height:100%;display:flex;flex-direction:column}
.paper{position:absolute;inset:0;pointer-events:none;opacity:var(--paperA)}
.paper.lines{background-image:repeating-linear-gradient(transparent 0,transparent calc(var(--lhpx) - 1px),var(--paper) calc(var(--lhpx) - 1px),var(--paper) var(--lhpx));background-position:0 var(--padtop)}
.paper.dots{background-image:radial-gradient(var(--paper) 1px,transparent 1.2px);background-size:18px 18px}
.paper.sgrid{background-image:linear-gradient(var(--paper) 1px,transparent 1px),linear-gradient(90deg,var(--paper) 1px,transparent 1px);background-size:20px 20px}
.paper.lgrid{background-image:linear-gradient(var(--paper) 1px,transparent 1px),linear-gradient(90deg,var(--paper) 1px,transparent 1px);background-size:40px 40px}
.ed{position:relative;outline:none;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;line-height:var(--lh);
  padding:var(--padtop,46px) var(--pad) 120px var(--pad);flex:1;min-height:0;user-select:text;-webkit-user-select:text;caret-color:var(--cursor);cursor:text;tab-size:4}
.ed.noentry{caret-color:transparent}
.ed.locked{opacity:.85}
.ln{min-height:calc(var(--fs)*var(--lh));position:relative}
.ln.h1{font-size:1.55em;font-weight:700;color:var(--heading);line-height:1.35;padding:.25em 0}
.ln.h2{font-size:1.3em;font-weight:700;color:var(--heading);line-height:1.4;padding:.2em 0}
.ln.h3{font-size:1.12em;font-weight:700;color:var(--heading);line-height:1.5;padding:.1em 0}
.ln.comment,.ln.comment *{color:var(--comment)!important;font-style:italic}
.ln.kw .kw{color:var(--accent);font-weight:600}
.ln.kw .kwsep{color:var(--muted)}
.ln.kw .kwtitle{color:var(--fg);font-weight:600}
.ln.checked .body{text-decoration:line-through;color:var(--muted)}
.ln.checked .body *{color:var(--muted)}
.ln.indent1{padding-left:1.6em}.ln.indent2{padding-left:3.2em}.ln.indent3{padding-left:4.8em}.ln.indent4{padding-left:6.4em}
.md{color:var(--muted);opacity:.55}
.b{font-weight:700}.i{font-style:italic}.s{text-decoration:line-through;text-decoration-color:var(--muted)}.u{text-decoration:underline;text-underline-offset:3px}
.tick{color:var(--muted);opacity:.7}
.code{font-family:var(--font);background:var(--codebg);border-radius:4px;padding:0 .3em}
.ln.fence{background:var(--codebg);margin:0 calc(-1 * var(--pad) / 2);padding:0 calc(var(--pad) / 2);white-space:pre}
.ln.fence.first{border-radius:8px 8px 0 0;padding-top:4px}
.ln.fence.last{border-radius:0 0 8px 8px;padding-bottom:4px}
.ln.fence .md{opacity:.4}
.v{color:var(--var)}.vc{color:var(--colon);font-weight:700}.vr{color:var(--var);opacity:.8}
.op{color:var(--muted)}
.res{color:var(--res);font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:4px;padding:0 3px;margin-left:.35em}
.res:hover{background:var(--codebg)}
.res.err{color:var(--muted);font-weight:400;opacity:.7}
.res.copied{background:var(--sel)}
.pct{color:var(--colon)}
a.lnk,.lnk{color:var(--link);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.lnk.short::before{content:"+"}.lnk.short::after{content:"+"}
.lnk .dup{font-size:.8em;opacity:.7}
.wid{display:inline-block;user-select:none;-webkit-user-select:none}
.cb{display:inline-flex;align-items:center;justify-content:center;width:1.05em;height:1.05em;border:1.5px solid var(--check);border-radius:4px;vertical-align:-.18em;margin-right:.5em;cursor:pointer;color:var(--bg);font-size:.9em;transition:background .12s}
.cb.on{background:var(--check)}
.cb.on::after{content:"";width:.32em;height:.6em;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-.1em) rotate(45deg)}
.bul{display:inline-block;width:1.4em;color:var(--muted)}
.bul::before{content:"–"}
.num{display:inline-block;min-width:1.6em;color:var(--muted)}
.hl{background:var(--hl);color:#222;border-radius:2px}
.hl.cur{outline:2px solid var(--accent)}
.ln .ph{position:absolute;left:0;top:0;color:var(--muted);opacity:.55;pointer-events:none;white-space:nowrap}
.img-ocr{color:var(--muted);font-style:italic}
/* syntax highlight tokens */
.t-kw{color:var(--sx-kw,#a626a4)}.t-str{color:var(--sx-str,#50a14f)}.t-num{color:var(--sx-num,#986801)}.t-com{color:var(--sx-com,#a0a1a7);font-style:italic}
.t-fn{color:var(--sx-fn,#4078f2)}.t-ty{color:var(--sx-ty,#c18401)}.t-op{color:var(--sx-op,#0184bc)}.t-tag{color:var(--sx-tag,#e45649)}.t-attr{color:var(--sx-attr,#986801)}

/* ---------- timer gutter ---------- */
.tgut{position:absolute;left:8px;top:var(--padtop,46px);bottom:30px;width:22px;pointer-events:none;z-index:4;display:none}
.tgut.on{display:block}
.tgut .tt{font-size:10px;line-height:1.05;color:var(--barfg);text-align:center;white-space:pre;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none}
.tgut .tt.big{color:var(--accent)}
.tgut .dots{position:absolute;left:9px;top:30px;bottom:34px;width:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.tgut .dots i{display:block;width:4px;height:4px;border-radius:2px;background:var(--muted);opacity:.3;flex:none}
.tgut .dots i.on{background:var(--accent);opacity:1}
.tgut .dots.paused i.on{animation:blink 1.2s steps(2) infinite}
.tgut .tb{position:absolute;bottom:0;left:0;width:22px}
.tgut .tb .tt{pointer-events:auto}
#tfull{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(var(--bgRGB),.97);cursor:pointer}
#tfull.on{display:flex}
#tfull .big{font-size:min(18vw,180px);font-weight:700;letter-spacing:-.03em;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
#tfull .ttl{font-size:1.3em;color:var(--fg);margin-top:14px}
#tfull .sub{color:var(--muted);margin-top:18px;font-size:.85em}
#tfull .ring{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .9s linear}
#talert{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column;background:var(--accent);color:#fff;cursor:pointer;text-align:center}
#talert.on{display:flex}
#talert b{font-size:min(14vw,120px);line-height:1}
#talert span{font-size:1.4em;margin-top:16px;opacity:.9}

/* ---------- bottom bar ---------- */
#bottom{height:26px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:11px;color:var(--barfg);background:rgba(var(--barRGB),var(--bgA));border-top:1px solid var(--border);z-index:20;position:relative;white-space:nowrap;overflow:hidden}
#bottom .stat{color:var(--accent);font-weight:600;cursor:pointer;border-radius:4px;padding:0 4px}
#bottom .stat:hover{background:var(--codebg)}
#bottom .stat.copied{background:var(--sel)}
#bottom .dim{opacity:.7}
#bottom .sp{flex:1}
#bottom .pill{border:1px solid var(--border);border-radius:10px;padding:0 7px;line-height:17px}
#bottom .pill.warn{border-color:var(--colon);color:var(--colon);cursor:pointer}
#bottom .pill.ap{color:var(--accent);border-color:var(--accent);animation:blink 1.1s steps(2) infinite;cursor:pointer}
#bottom .ib{width:22px;height:20px}
#bottom .ib svg{width:13px;height:13px}
.nobar #bottom{display:none}

/* ---------- slot bar (planets) ---------- */
#slotbar{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 10px;border-radius:20px;background:rgba(var(--barRGB),.92);border:1px solid var(--border);
  box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
#slotbar.show{opacity:1;pointer-events:auto}
#slotbar button{width:22px;height:22px;border-radius:50%;position:relative;opacity:.75;transition:transform .12s}
#slotbar button:hover{transform:scale(1.2);opacity:1}
#slotbar button.cur{opacity:1;box-shadow:0 0 0 2px var(--bar),0 0 0 3.5px var(--accent)}
#slotbar button i{position:absolute;inset:0;border-radius:50%}
#slotbar button[data-n="0"] i{background:radial-gradient(circle at 35% 35%,#e3d9cc,#8e867b)}
#slotbar button[data-n="1"] i{background:radial-gradient(circle at 35% 35%,#f4e3b8,#c79a4c)}
#slotbar button[data-n="2"] i{background:radial-gradient(circle at 35% 35%,#8ad1ff,#2a6fbd 60%,#2f8f4e)}
#slotbar button[data-n="3"] i{background:radial-gradient(circle at 35% 35%,#ffb28a,#b9502a)}
#slotbar button[data-n="4"] i{background:repeating-linear-gradient(170deg,#e8c9a0 0 2px,#c4915e 2px 4px,#f3dfc0 4px 6px);}
#slotbar button[data-n="5"] i{background:radial-gradient(circle at 35% 35%,#f5e6b8,#c9ab63);box-shadow:0 0 0 2px rgba(201,171,99,.35) inset}
#slotbar button[data-n="5"]::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:3px;border-radius:3px;background:rgba(201,171,99,.7);transform:rotate(-20deg)}
#slotbar button[data-n="6"] i{background:radial-gradient(circle at 35% 35%,#cdf7fb,#5ec7cf)}
#slotbar button[data-n="7"] i{background:radial-gradient(circle at 35% 35%,#7ea6ff,#2b4fd8)}
#slotbar button[data-n="8"] i{background:radial-gradient(circle at 35% 35%,#e6dcd3,#9c8c85);transform:scale(.7)}
.slotname{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;font-size:10px;background:var(--fg);color:var(--bg);padding:2px 6px;border-radius:4px;white-space:nowrap;display:none}
#slotbar button:hover .slotname{display:block}

/* ---------- popovers (slash menu, autocomplete, extensions) ---------- */
.pop{position:absolute;z-index:80;background:rgba(var(--barRGB),.98);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:5px;min-width:200px;max-width:min(440px,90%);font-size:12.5px;max-height:300px;overflow:auto}
.pop .it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.pop .it:hover,.pop .it.sel{background:var(--codebg)}
.pop .it .n{min-width:14px;color:var(--muted);font-size:11px}
.pop .it .k{font-weight:600;color:var(--accent)}
.pop .it .d{color:var(--muted);overflow:hidden;text-overflow:ellipsis;flex:1}
.pop .hd{padding:4px 8px;font-size:11px;color:var(--muted)}
.pop .sig{padding:6px 8px;font-size:12px}
.pop .sig .ok{color:#2f9e44}.pop .sig .bad{color:var(--colon)}
.pop .sig b{color:var(--accent)}
.pop .sig .p{opacity:.8}
.pop .sig .p.cur{text-decoration:underline;opacity:1;font-weight:600}
.pop .sig small{display:block;color:var(--muted);margin-top:3px;font-size:11px}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:50;background:rgba(var(--bgRGB),.98);display:none;flex-direction:column;min-height:0}
.ov.on{display:flex}
.ovh{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px;border-bottom:1px solid var(--border)}
.ovh h2{font-size:13px;margin:0;font-weight:600;flex:1;color:var(--fg)}
.ovb{flex:1;overflow:auto;min-height:0}
.ovf{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--border);font-size:12px;color:var(--barfg)}
.ovf .sp{flex:1}
.field{display:flex;align-items:center;gap:6px;background:var(--codebg);border-radius:8px;padding:5px 9px;flex:1}
.field input{flex:1;border:0;background:none;outline:0;font-size:13px;color:var(--fg);min-width:0}
.field input::placeholder{color:var(--muted)}
.tog{font-size:11px;padding:2px 7px;border-radius:6px;color:var(--barfg);border:1px solid transparent}
.tog:hover{background:var(--codebg)}
.tog.on{color:var(--accent);border-color:var(--accent)}
.btn{font-size:12px;padding:4px 10px;border-radius:7px;background:var(--codebg);color:var(--fg);border:1px solid var(--border)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--colon);border-color:var(--colon)}
.btn.sm{font-size:11px;padding:2px 7px}
.btn:disabled{opacity:.4;pointer-events:none}
select.sel{background:var(--codebg);border:1px solid var(--border);border-radius:6px;padding:2px 4px;font-size:12px;color:var(--fg);outline:0;max-width:220px}
.kbd{font-size:10px;padding:0 4px;border:1px solid var(--border);border-radius:4px;color:var(--muted);margin-left:4px}

/* search results */
#srl{padding:6px}
.sr{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;position:relative}
.sr:hover,.sr.sel{background:var(--codebg)}
.sr.dragover{box-shadow:0 -2px 0 var(--accent) inset}
.sr .chk{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;margin-top:3px;flex:none}
.sr .chk.on{background:var(--accent);border-color:var(--accent)}
.sr .txt{flex:1;min-width:0;user-select:none}
.sr .t1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.sr .t1.kw{color:var(--accent)}
.sr .t2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sr .meta{font-size:10px;color:var(--muted);margin-top:2px}
.sr .acts{display:flex;gap:2px;opacity:0}
.sr:hover .acts,.sr.sel .acts{opacity:1}
.sr .slotbadge{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.sr .lockb{font-size:10px;margin-left:6px}
.sr mark{background:var(--hl);color:#222;border-radius:2px}
#srl.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
#srl.cards .sr{flex-direction:column;border:1px solid var(--border);height:150px;overflow:hidden;background:rgba(var(--bgRGB),.6)}
#srl.cards .sr .txt{width:100%}
#srl.cards .sr .t2{white-space:pre-wrap;font-size:9.5px;line-height:1.35;max-height:88px}
#srl.cards .sr .acts{position:absolute;top:4px;right:4px;background:var(--bar);border-radius:6px}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:12.5px}

/* find & replace bar */
#frbar{display:none;flex-direction:column;gap:5px;padding:8px 10px;border-bottom:1px solid var(--border);background:rgba(var(--barRGB),.95);font-size:12px;z-index:21;position:relative}
#frbar.on{display:flex}
#frbar .row{display:flex;align-items:center;gap:6px}
#frbar .cnt{font-size:11px;color:var(--muted);min-width:56px;text-align:right}

/* settings */
#settings .ovb{display:flex;min-height:0}
#sside{width:128px;flex:none;border-right:1px solid var(--border);padding:8px 6px;overflow:auto}
#sside button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:7px;font-size:12.5px;color:var(--barfg)}
#sside button:hover{background:var(--codebg)}
#sside button.on{background:var(--codebg);color:var(--accent);font-weight:600}
#sbody{flex:1;overflow:auto;padding:10px 16px 30px}
.sg{margin:6px 0 18px}
.sg h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.sr2{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;min-height:34px}
.sr2 .l{flex:1 1 150px;min-width:0}
.sr2>*:not(.l){flex:0 0 auto}
.sr2 .l small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}
.sr2 input[type=text],.sr2 input[type=password],.sr2 input[type=number],.sr2 input[type=date]{background:var(--codebg);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px;color:var(--fg);outline:0;width:180px}
.sr2 input[type=number]{width:70px}
.sr2 input[type=range]{width:140px;accent-color:var(--accent)}
.sr2 input[type=color]{width:34px;height:24px;border:0;background:none;padding:0}
.sw{width:34px;height:20px;border-radius:10px;background:var(--muted);position:relative;flex:none;opacity:.5;transition:.15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent);opacity:1}
.sw.on::after{left:16px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{padding:3px 9px;font-size:11.5px;color:var(--barfg)}
.seg button.on{background:var(--accent);color:#fff}
.keyrec{min-width:90px;text-align:center;background:var(--codebg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px}
.keyrec.rec{border-color:var(--accent);color:var(--accent);animation:blink 1s steps(2) infinite}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0}
.thumb{border-radius:9px;border:2px solid transparent;padding:8px;cursor:pointer;font-size:10.5px;line-height:1.5;height:74px;overflow:hidden;position:relative}
.thumb.on{border-color:var(--accent)}
.thumb .tn{font-weight:600;font-size:11px;margin-bottom:2px}
.thumb .lt,.thumb .dk{position:absolute;top:4px;right:6px;font-size:10px;opacity:.9}
.thumb .dk{right:22px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:6px 0}
.note code{background:var(--codebg);padding:0 4px;border-radius:3px}
.warnpill{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--colon);border:1px solid var(--colon);border-radius:8px;padding:2px 8px;margin:4px 0}
.list2{font-size:12px}
.list2 .row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.list2 .row .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea.ta{width:100%;min-height:120px;background:var(--codebg);border:1px solid var(--border);border-radius:7px;padding:6px;font-size:11.5px;color:var(--fg);outline:0;resize:vertical;user-select:text;-webkit-user-select:text}

/* toast & dialogs */
#toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:7px 12px;border-radius:9px;font-size:12px;z-index:300;opacity:0;pointer-events:none;transition:.2s;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#dlg{position:absolute;inset:0;z-index:350;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
#dlg.on{display:flex}
#dlg .box{background:rgba(var(--barRGB),1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-width:260px;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.3);font-size:13px}
#dlg .box p{margin:0 0 12px;line-height:1.5}
#dlg .box .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
#dlg .box label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-right:auto}
#dlg input[type=text]{width:100%;margin-bottom:12px;background:var(--codebg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;outline:0;color:var(--fg)}

/* note transitions */
.pane .scroll{transition:transform .22s cubic-bezier(.2,.7,.2,1),opacity .22s}
.pane .scroll.outL{transform:translateX(-40px);opacity:0}
.pane .scroll.outR{transform:translateX(40px);opacity:0}
.pane .scroll.inL{transform:translateX(40px);opacity:0;transition:none}
.pane .scroll.inR{transform:translateX(-40px);opacity:0;transition:none}
.pane .scroll.bounce{animation:bounce .3s}
@keyframes bounce{30%{transform:translateX(-14px)}100%{transform:none}}
.pane .scroll.bounceR{animation:bounceR .3s}
@keyframes bounceR{30%{transform:translateX(14px)}100%{transform:none}}
#emptyhint{position:absolute;left:0;right:0;top:45%;text-align:center;color:var(--muted);font-size:12px;pointer-events:none;opacity:0;transition:.2s}
#emptyhint.on{opacity:.7}
.tut{position:absolute;z-index:70;background:rgba(var(--barRGB),.98);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:10px 12px;font-size:12px;line-height:1.6;max-width:360px;color:var(--fg)}
.tut b{color:var(--accent)}
.tut .x{position:absolute;top:4px;right:8px;color:var(--muted);cursor:pointer}

@media print{
  body,#app{background:#fff!important;color:#000!important;overflow:visible!important;height:auto!important}
  #top,#bottom,#slotbar,.ov,.tgut,.paper,#app::after{display:none!important}
  .ed{padding:0!important;user-select:text}
  .scroll{overflow:visible!important}
}

'use strict';
/* ===================================================================
   0. Utilities & environment
   =================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const now=()=>Date.now();
const isMac=navigator.platform.includes('Mac')||navigator.userAgent.includes('Mac');
const hexToRgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const mix=(a,b,t)=>{const A=hexToRgb(a),B=hexToRgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const fmtDate=(ts,withTime)=>{const d=new Date(ts);const p=n=>String(n).padStart(2,'0');const s=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;return withTime?`${s} ${p(d.getHours())}:${p(d.getMinutes())}`:s};
const rel=ts=>{const d=now()-ts,m=6e4,h=36e5,day=864e5;if(d<m)return'just now';if(d<h)return Math.floor(d/m)+'m ago';if(d<day)return Math.floor(d/h)+'h ago';if(d<7*day)return Math.floor(d/day)+'d ago';return fmtDate(ts)};
let toastT;function toast(msg,ms=1600){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}

/* ---- native bridge (falls back to browser APIs) ---- */
const pending={};
const Native={
  send(cmd,data={}){ if(NATIVE){ window.webkit.messageHandlers.native.postMessage(Object.assign({cmd},data)); return true;} return false; },
  call(cmd,data={}){ return new Promise(res=>{ const id=uid(); pending[id]=res; if(!this.send(cmd,Object.assign({id},data))) { delete pending[id]; res(null);} }); },
  reply(id,data){ if(pending[id]){ pending[id](data); delete pending[id]; } }
};
window.AN=window.AN||{};   // native → JS entry points are attached below
AN.reply=(id,data)=>Native.reply(id,data);

async function nfetch(url,opt={}){
  if(NATIVE){ const r=await Native.call('fetch',{url,method:opt.method||'GET',headers:opt.headers||{},body:opt.body||null}); if(!r||r.error)throw new Error(r?r.error:'fetch failed'); return {ok:r.status>=200&&r.status<300,status:r.status,text:async()=>r.body,json:async()=>JSON.parse(r.body)}; }
  return fetch(url,opt);
}
function openURL(u){ if(!Native.send('openURL',{url:u})) window.open(u,'_blank'); }
function copyText(t){ if(!Native.send('copy',{text:t})){ navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{}); } }

    if(!shift&&!L.fence&&!L.kwLine){ const tc=timerCommand(line); if(tc){ this.app.timer.command(tc,line); if(['pause','restart','stop'].includes(tc.cmd)){ this.replaceRange(ls,le,''); return; } }

    // extension command on line?  ::cmd(args)
    if(!shift&&S.enableExtensions){ const m=line.slice(0,local).match(/::([\w-]+)(\((.*)\))?\s*$/); if(m){ const cmd=Ext.find(m[1]); if(cmd){ Ext.run(cmd,m[3],this,{s:ls+m.index,e:ls+local}); return; } } }

    let prefix=''; const indent=(line.match(/^[ \t]*/)||[''])[0];
    if(L.marker&&!shift){ const body=line.slice(L.marker.e).trim(); if(!body&&local>=L.marker.e){ this.replaceRange(ls,le,'',{}); return; } // end list
      if(local>=L.marker.e){ if(L.marker.type==='cb') prefix=indent+(line.slice(L.marker.s,L.marker.e).startsWith('- ')?'- [ ] ':'[] '); else if(L.marker.type==='bul') prefix=indent+line.slice(L.marker.s,L.marker.e); else prefix=indent+(L.marker.num+1)+L.marker.delim+' '; } }
    else if(L.fence&&!L.fenceOpen){ prefix=indent; }

    if(info.kw&&li===0&&info.kw.mode==='timer') {} }
  toggleCheckbox(li){ const info=this.info; const L=info.L[li]; const [ls,le]=this.lineRange(li); const line=info.lines[li]; const keep=this.caret;
    if(L.marker&&L.marker.type==='cb'){ const src=line.slice(L.marker.s,L.marker.e); const nsrc=L.marker.checked?src.replace(/\[[xX]\]/,'[ ]').replace('[ ] ','[] '):src.replace(/\[ ?\]/,'[x]'); const text=this.text.slice(0,ls+L.marker.s)+nsrc+this.text.slice(ls+L.marker.e); const d=nsrc.length-src.length; this.commit(text,{start:keep.start>ls+L.marker.s?keep.start+d:keep.start,end:keep.end>ls+L.marker.s?keep.end+d:keep.end}); return; }

  indentLines(out){ const info=this.info; const a=this.lineAt(this.caret.start), b=this.lineAt(Math.max(this.caret.start,this.caret.end-(this.caret.end>this.caret.start?1:0))); let text=this.text; let delta0=0,deltaAll=0; const lines=text.split('\n');
    for(let i=a;i<=b;i++){ const t=lines[i]; if(out){ const m=t.match(/^(\t|  ?)/); if(m){ lines[i]=t.slice(m[0].length); const d=-m[0].length; if(i===a) delta0=d; deltaAll+=d; } } else { let nt='  '+t; const nm=nt.match(/^([ \t]*)(\d+)([.)] )/); if(nm){ nt=nm[1]+'1'+nm[3]+nt.slice(nm[0].length); } lines[i]=nt; const d=nt.length-t.length; if(i===a) delta0=d; deltaAll+=d; } }
    const nt=lines.join('\n'); const s=Math.max(info.starts[a],this.caret.start+delta0); const e=this.caret.end+deltaAll; this.commit(nt,{start:s,end:Math.max(s,e)}); }
  moveLines(dir){ const info=this.info; const a=this.lineAt(this.caret.start), b=this.lineAt(Math.max(this.caret.start,this.caret.end-(this.caret.end>this.caret.start?1:0))); const lines=this.text.split('\n'); if(dir<0&&a===0) return; if(dir>0&&b===lines.length-1) return;
    const block=lines.splice(a,b-a+1); const swap=dir<0?lines[a-1]:lines[a]; if(dir<0){ lines.splice(a-1,1); lines.splice(a-1,0,...block,swap); } else { lines.splice(a,1); lines.splice(a,0,swap,...block); }
    const d=(swap.length+1)*dir; this.commit(lines.join('\n'),{start:this.caret.start+d,end:this.caret.end+d}); }
  toggleComment(){ const a=this.lineAt(this.caret.start), b=this.lineAt(Math.max(this.caret.start,this.caret.end-(this.caret.end>this.caret.start?1:0))); const lines=this.text.split('\n'); const all=lines.slice(a,b+1).every(l=>/^\s*\/\//.test(l)); let d0=0,dAll=0;
    for(let i=a;i<=b;i++){ const t=lines[i]; let nt; if(all){ nt=t.replace(/^(\s*)\/\/ ?/,'$1'); } else { nt=t.replace(/^(\s*)/,'$1// '); } const d=nt.length-t.length; if(i===a) d0=d; dAll+=d; lines[i]=nt; }
    this.commit(lines.join('\n'),{start:Math.max(this.info.starts[a],this.caret.start+d0),end:this.caret.end+dAll}); }
  wrapSelection(mark){ let {start,end}=this.caret; const text=this.text; if(start===end){ // word under cursor
      let s=start,e=end; while(s>0&&/[\p{L}\p{N}_'’]/u.test(text[s-1])) s--; while(e<text.length&&/[\p{L}\p{N}_'’]/u.test(text[e])) e++; start=s; end=e; }
    const sel=text.slice(start,end); const L=mark.length;
    if(sel.startsWith(mark)&&sel.endsWith(mark)&&sel.length>=2*L){ this.commit(text.slice(0,start)+sel.slice(L,-L)+text.slice(end),{start,end:end-2*L}); return; }
    if(text.slice(start-L,start)===mark&&text.slice(end,end+L)===mark){ this.commit(text.slice(0,start-L)+sel+text.slice(end+L),{start:start-L,end:end-L}); return; }
    if(start===end){ this.commit(text.slice(0,start)+mark+mark+text.slice(end),{start:start+L,end:start+L}); return; }
    this.commit(text.slice(0,start)+mark+sel+mark+text.slice(end),{start:start+L,end:end+L}); }
  cycleHeading(){ const li=this.lineAt(this.caret.start); const [ls]=this.lineRange(li); const line=this.info.lines[li]; const m=line.match(/^(#{1,3}) /); let nl; if(!m) nl='# '+line; else if(m[1].length<3) nl='#'+line; else nl=line.slice(4); const d=nl.length-line.length; this.commit(this.text.slice(0,ls)+nl+this.text.slice(ls+line.length),{start:Math.max(ls,this.caret.start+d),end:Math.max(ls,this.caret.end+d)}); }
  /* ---- clipboard ---- */
  copyPayload(){ const {start,end}=this.caret; const info=this.info;
    if(start!==end){ return this.exportText(start,end); }

    if(L.fence){ let a=li,b=li; while(a>0&&!info.L[a].fenceOpen) a--; while(b<info.lines.length-1&&!info.L[b].fenceClose) b++; return info.lines.slice(info.L[a].fenceOpen?a+1:a,info.L[b].fenceClose?b:b+1).join('\n'); }

  exportText(start,end,whole){ const info=this.info; const lines=[]; const a=this.lineAt(start), b=this.lineAt(Math.max(start,end-1));
    for(let i=a;i<=b;i++){ let t=info.lines[i]; const ls=info.starts[i]; let s=Math.max(0,start-ls), e=Math.min(t.length,end-ls); const L=info.L[i];
      if(i===0&&L.kwLine&&S.skipKeywordOnCopy&&whole){ const title=info.kw.title; if(!title) continue; t=title; s=0; e=t.length; lines.push(t); continue; }
      let seg=t.slice(s,e); if(L.listItem&&L.checked&&S.skipTriggersOnCopy&&e>=L.trigS){ seg=t.slice(s,Math.min(e,L.trigS)).replace(/\s+$/,''); }

  stripPaste(t){ if(this.info&&this.info.mode==='code') return t.replace(/\r\n?/g,'\n'); t=t.replace(/\r\n?/g,'\n').replace(/\t/g,'    ').replace(/\u00a0/g,' ');

  /* ---- events ---- */
  bind(){ const el=this.el;
    el.addEventListener('beforeinput',e=>this.onBeforeInput(e));
    el.addEventListener('input',e=>{ if(this.composing) return; if(e.inputType&&e.inputType.startsWith('insert')) this.syncFromDOM(true); else if(e.inputType&&e.inputType.startsWith('delete')) this.syncFromDOM(true); else this.syncFromDOM(false); this.app.afterInput(this,e); });
    el.addEventListener('compositionstart',()=>{ this.composing=true; });
    el.addEventListener('compositionend',()=>{ this.composing=false; this.syncFromDOM(false); });
    el.addEventListener('keydown',e=>this.app.onKeyDown(e,this));
    el.addEventListener('paste',e=>this.onPaste(e));
    el.addEventListener('copy',e=>{ const p=this.copyPayload(); e.clipboardData.setData('text/plain',p); e.preventDefault(); if(this.caret.start===this.caret.end) toast('Copied note'); });
    el.addEventListener('cut',e=>{ if(this.note&&this.note.locked){e.preventDefault();return;} const p=this.exportText(this.caret.start,this.caret.end); e.clipboardData.setData('text/plain',p); e.preventDefault(); if(this.caret.start!==this.caret.end) this.replaceRange(this.caret.start,this.caret.end,''); });
    el.addEventListener('drop',e=>this.onDrop(e)); el.addEventListener('dragover',e=>{ e.preventDefault(); });
    el.addEventListener('mousedown',e=>{ if(this.noentry) this.focus(); const w=e.target.closest('.wid,.res'); if(w){ e.preventDefault(); } });
    el.addEventListener('click',e=>this.onClick(e));
    el.addEventListener('dblclick',e=>{ const w=e.target.closest('.lnk'); if(w&&!(e.metaKey)){ /* select url text */ } });
    this.scroll.addEventListener('mousedown',e=>{ if(e.target===this.scroll||e.target===this.paper){ // click below text -> caret to end
        if(this.noentry) this.focus(); this.setSel(this.text.length,this.text.length); e.preventDefault(); } });
    document.addEventListener('selectionchange',()=>{ if(document.activeElement!==el) return; const s=this.getSel(); if(!s) return; const moved=s.start!==this.caret.start||s.end!==this.caret.end; this.caret={start:s.start,end:s.end}; if(moved){ this.app.onCaretMove(this); const cl=this.lineAt(s.start); if(this.info&&(this.info.L[cl].links||this.lastCaretLine!==cl&&this.info.L[this.lastCaretLine]&&this.info.L[this.lastCaretLine].links)) this.rerenderSoon(); this.lastCaretLine=cl; } });
    el.addEventListener('focus',()=>{ this.noentry=false; el.classList.remove('noentry'); });
  }
  onBeforeInput(e){ const t=e.inputType; if(this.note&&this.note.locked){ e.preventDefault(); return; }
    if(t==='insertParagraph'||t==='insertLineBreak'){ e.preventDefault(); this.handleEnter(t==='insertLineBreak'); return; }
    if(t==='historyUndo'){ e.preventDefault(); this.doUndo(); return; } if(t==='historyRedo'){ e.preventDefault(); this.doRedo(); return; }
    if(t==='insertFromPaste'||t==='insertFromDrop'||t==='insertFromYank'){ e.preventDefault(); return; }
    if(t.startsWith('format')){ e.preventDefault(); return; }
    if(t.startsWith('delete')){ // route through model using target ranges

      const li=this.lineAt(s); const L=this.info.L[li]; const ls=this.info.starts[li]; if(L&&L.marker&&en-s===1&&s-ls<L.marker.e&&s-ls>=L.marker.s&&!t.includes('Word')){ s=ls+L.marker.s; en=ls+L.marker.e; }
      if(L&&L.listItem&&L.checked&&en-s===1&&s-ls>=L.trigS&&s-ls<L.trigE){ s=ls+L.trigS; en=ls+L.trigE; }

      e.preventDefault(); if(en>s) this.replaceRange(s,en,'',{coalesce:true}); return; }
    if(t==='insertText'&&e.data){ // typing: let native, but handle popovers / auto-pairs here if needed
      if(this.caret.start!==this.caret.end){ // replace selection through model to keep widgets consistent
        e.preventDefault(); this.insertText(e.data,{coalesce:true}); return; }
      const li=this.lineAt(this.caret.start); const L=this.info.L[li]; const local=this.caret.start-this.info.starts[li];
      // typing right before/inside a widget boundary -> go through model
      if(local===0||this.info.lines[li]===''||(L.marker&&local<=L.marker.e&&local>=L.marker.s)||(L.listItem&&local===(this.info.lines[li].match(/^\s*/)[0].length))||(L.listItem&&L.checked&&local>=L.trigS)||(L.math&&L.math.showResult&&local>L.math.eqPos)){ e.preventDefault(); this.insertText(e.data,{coalesce:true}); return; }
      return; }
  }
  onPaste(e){ e.preventDefault(); if(this.note&&this.note.locked) return; const cd=e.clipboardData; if(!cd) return;
    for(const it of cd.items||[]){ if(it.type&&it.type.startsWith('image/')){ const f=it.getAsFile(); if(f){ this.app.ocrImage(f,this); return; } } }

  onDrop(e){ e.preventDefault(); if(this.note&&this.note.locked) return; const dt=e.dataTransfer; if(!dt) return; const files=[...(dt.files||[])]; const img=files.find(f=>/^image\/(png|jpe?g|gif|webp|heic|tiff?)$/i.test(f.type)||/\.(png|jpe?g|gif)$/i.test(f.name));
    if(img){ this.app.ocrImage(img,this); return; } const t=dt.getData('text/plain'); if(t){ // place caret at drop point
      const r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null; if(r){ const off=this.domPosToOffset(r.startContainer,r.startOffset); if(off!==null) this.caret={start:off,end:off}; } this.focus(); this.insertText(this.stripPaste(t)); } }
  onClick(e){ const t=e.target; const cb=t.closest('[data-act="togglecb"]'); if(cb){ const ln=cb.closest('.ln'); const li=[...this.el.children].indexOf(ln); this.toggleCheckbox(li); e.preventDefault(); return; }
    const res=t.closest('.res'); if(res){ copyText(res.getAttribute('data-v')); res.classList.add('copied'); setTimeout(()=>res.classList.remove('copied'),400); toast('Copied '+res.getAttribute('data-v')); e.preventDefault(); return; }
    const lnk=t.closest('.lnk'); if(lnk){ const url=lnk.getAttribute('data-url')||lnk.textContent; if(e.metaKey&&e.shiftKey){ const key=lnk.getAttribute('data-key'); if(key&&this.note){ this.note.expanded=this.note.expanded||[]; const i=this.note.expanded.indexOf(key); if(i>=0) this.note.expanded.splice(i,1); else this.note.expanded.push(key); this.app.noteChanged(this.note,this,true); this.render(); } e.preventDefault(); return; }
      if(e.metaKey||lnk.classList.contains('short')&&!lnk.classList.contains('wid')){ openURL(linkHref(url)); e.preventDefault(); return; }
      if(lnk.classList.contains('wid')){ // plain click on shortened link: open (like GetThatNote "click to open/expand")
        if(e.metaKey) openURL(linkHref(url)); else { // expand & place caret inside
          const key=lnk.getAttribute('data-key'); if(this.note){ this.note.expanded=this.note.expanded||[]; if(!this.note.expanded.includes(key)) this.note.expanded.push(key); this.app.noteChanged(this.note,this,true); } this.render(); } e.preventDefault(); return; } }
    if(this.noentry) this.focus(); }
  linkAtCaret(){ const li=this.lineAt(this.caret.start); const L=this.info.L[li]; const local=this.caret.start-this.info.starts[li]; if(L.links) for(const l of L.links) if(local>=l.s&&local<=l.e) return l.url; return null; }
}

<script>
/* ===================================================================
   7. Popovers: slash keyword menu, variable autocomplete, :: extensions
   =================================================================== */
const Pop={
  el:null,type:null,items:[],sel:0,ed:null,range:null,
  ensure(){ if(!this.el){ this.el=document.createElement('div'); this.el.className='pop'; this.el.style.display='none'; $('#app').appendChild(this.el); this.el.addEventListener('mousedown',e=>{ e.preventDefault(); const it=e.target.closest('.it'); if(it){ this.sel=+it.dataset.i; this.accept(); } }); } return this.el; },
  open(type,ed,items,range,extra={}){ this.ensure(); this.type=type; this.ed=ed; this.items=items; this.sel=0; this.range=range; this.extra=extra; this.renderItems(); this.position(); },
  close(){ if(this.el){ this.el.style.display='none'; } this.type=null; this.items=[]; this.ed=null; },
  get open_(){ return !!this.type; },
  position(){ const sel=window.getSelection(); let rect=null; if(sel.rangeCount){ const r=sel.getRangeAt(0).cloneRange(); rect=r.getBoundingClientRect(); if(!rect.height&&r.startContainer.nodeType===1){ rect=(r.startContainer.childNodes[r.startOffset]||r.startContainer).getBoundingClientRect(); } }
    const app=$('#app').getBoundingClientRect(); const el=this.el; el.style.display='block'; const w=el.offsetWidth,h=el.offsetHeight; let x=rect?rect.left-app.left:40, y=rect?rect.bottom-app.top+6:60; if(x+w>app.width-10) x=Math.max(6,app.width-w-10); if(y+h>app.height-30) y=Math.max(6,(rect?rect.top-app.top:60)-h-6); el.style.left=x+'px'; el.style.top=y+'px'; },
  renderItems(){ const el=this.ensure(); let h=''; if(this.type==='slash'){ h+='<div class="hd">Keywords — press a number</div>'; this.items.forEach((it,i)=>{ h+=`<div class="it${i===this.sel?' sel':''}" data-i="${i}"><span class="n">${i+1}</span><span class="k">${esc(it.kw)}</span><span class="d">${esc(it.desc)}</span></div>`; }); }
    else if(this.type==='var'){ h+='<div class="hd">Variables — Tab to autofill'+(this.items.length>1?', number to pick':'')+'</div>'; this.items.forEach((it,i)=>{ h+=`<div class="it${i===this.sel?' sel':''}" data-i="${i}"><span class="n">${this.items.length>1?i+1:''}</span><span class="k">${esc(it.name)}</span><span class="d">${esc(MathEngine.fmtNum(it.value))}</span></div>`; }); }
    else if(this.type==='ext'){ h+='<div class="hd">Extensions — ↩ run · Tab complete · Esc dismiss</div>'; if(!this.items.length) h+='<div class="it"><span class="d">No matching commands</span></div>'; this.items.slice(0,40).forEach((it,i)=>{ h+=`<div class="it${i===this.sel?' sel':''}" data-i="${i}"><span class="k">::${esc(it.name)}</span><span class="d">${esc(it.description||'')}${it.params&&it.params.length?' <span class="kbd">'+it.params.map(p=>p.name).join(', ')+'</span>':''}</span></div>`; }); }
    else if(this.type==='extparam'){ const c=this.extra.cmd, args=this.extra.args||[], cur=this.extra.cur||0; const v=this.extra.valid; h+=`<div class="sig"><b>::${esc(c.name)}</b>(${(c.params||[]).map((p,i)=>`<span class="p${i===cur?' cur':''}">${esc(p.name)}${p.default!==undefined&&p.default!==''?'='+esc(String(p.default)):''}</span>`).join(', ')}) <span class="${v.ok?'ok':'bad'}">${v.ok?'✓':'✕ '+esc(v.msg||'')}</span><small>${esc(c.description||'')}${c.params&&c.params[cur]&&c.params[cur].description?' — '+esc(c.params[cur].description):''}</small><small>↩ run · Tab default · Esc dismiss</small></div>`; }
    el.innerHTML=h; el.style.display='block'; },
  move(d){ if(!this.items.length) return; this.sel=(this.sel+d+this.items.length)%this.items.length; this.renderItems(); const s=$('.it.sel',this.el); if(s) s.scrollIntoView({block:'nearest'}); },
  accept(){ const ed=this.ed; if(!ed) return; const it=this.items[this.sel];
    if(this.type==='slash'){ App.applyKeyword(ed,it.kw,this.range); this.close(); return; }
    if(this.type==='var'){ if(!it) return; const r=this.range; ed.replaceRange(r.s,r.e,it.name); this.close(); return; }
    if(this.type==='ext'){ if(!it) return; const r=this.range; const hasP=it.params&&it.params.length; const txt='::'+it.name+(hasP?'('+it.params.map(p=>p.default!==undefined?String(p.default):'').join(', ')+')':''); ed.replaceRange(r.s,r.e,txt); this.close(); if(hasP){ // place caret inside parens on first param
        const s=r.s+2+it.name.length+1; ed.setSel(s,s+String(it.params[0].default!==undefined?it.params[0].default:'').length); App.checkPopovers(ed); } return; }
    if(this.type==='extparam'){ this.close(); return; } },
  handleKey(e,ed){ if(!this.type||this.ed!==ed) return false; const k=e.key;

/* ===================================================================
   9. Timer
   =================================================================== */
const Timer={
  st:null,tick:null,
  command(tc,line){ switch(tc.cmd){ case 'stopwatch': this.start({kind:'stopwatch',title:tc.title||''}); break; case 'countdown': this.start({kind:'countdown',title:tc.title||'',duration:Math.max(1,Math.round(tc.minutes*60000))}); break; case 'pomo': this.start({kind:'pomo',title:tc.title||'Pomodoro',work:Math.round(tc.work*60000),rest:Math.round(tc.rest*60000),phase:'work',duration:Math.round(tc.work*60000),cycle:1}); break; case 'pause': this.pause(); break; case 'restart': this.restart(); break; case 'stop': this.stop(); break; } },
  start(st){ this.st=Object.assign(st,{startedAt:now(),elapsedBefore:0,paused:false,done:false}); this.ensureTick(); this.render(); toast(st.kind==='stopwatch'?'Stopwatch started':st.kind==='pomo'?`Pomodoro ${Math.round(st.work/60000)}/${Math.round(st.rest/60000)} started`:'Timer '+this.fmt(st.duration)+' started'); },
  elapsed(){ const s=this.st; if(!s) return 0; return s.elapsedBefore+(s.paused?0:now()-s.startedAt); },
  remaining(){ const s=this.st; if(!s||s.kind==='stopwatch') return null; return Math.max(0,s.duration-this.elapsed()); },
  pause(){ const s=this.st; if(!s) return; if(s.paused){ s.paused=false; s.startedAt=now(); toast('Timer resumed'); } else { s.elapsedBefore=this.elapsed(); s.paused=true; toast('Timer paused'); } this.render(); },
  restart(){ const s=this.st; if(!s) return; s.elapsedBefore=0; s.startedAt=now(); s.paused=false; s.done=false; if(s.kind==='pomo'){ s.phase='work'; s.duration=s.work; s.cycle=1; } this.render(); toast('Timer restarted'); },
  stop(){ if(!this.st) return; this.st=null; clearInterval(this.tick); this.tick=null; this.render(); $('#tfull').classList.remove('on'); Native.send('menubarTimer',{text:''}); toast('Timer stopped'); },
  ensureTick(){ if(this.tick) return; this.tick=setInterval(()=>this.update(),250); },
  update(){ const s=this.st; if(!s) return; if(s.kind!=='stopwatch'&&!s.paused){ const r=this.remaining(); if(r<=0&&!s.done){ this.finish(); } } this.render(); },
  finish(){ const s=this.st; if(s.kind==='countdown'){ s.done=true; s.paused=true; s.elapsedBefore=s.duration; this.alert(S.countdownEnd,(s.title||'Timer')+' finished',this.fmt(s.duration)); setTimeout(()=>{ if(this.st===s) this.stop(); },1500); }
    else if(s.kind==='pomo'){ const wasWork=s.phase==='work'; const longEnough=s.duration>30000; if(longEnough) this.alert(S.pomoEnd,wasWork?'Work block done — take a break':'Break over — back to work',wasWork?this.fmt(s.rest):this.fmt(s.work)); s.phase=wasWork?'rest':'work'; s.duration=wasWork?s.rest:s.work; if(!wasWork) s.cycle++; s.elapsedBefore=0; s.startedAt=now(); } },
  alert(how,title,body){ if(how==='fullscreen'){ const a=$('#talert'); $('b',a).textContent=body; $('span',a).textContent=title; a.classList.add('on'); Native.send('alertShow',{title,body}); this.beep(); } else if(how==='sound'){ this.beep(); toast(title); } else { this.notify(title,body); this.beep(.5); } },
  beep(scale=1){ const vol=(S.alertVolume||0)/100*scale; if(vol<=0) return; if(Native.send('playSound',{volume:vol})) return; try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.value=vol*.3; o.start(); setTimeout(()=>{ o.frequency.value=1175; },180); setTimeout(()=>{ o.stop(); ac.close(); },420); }catch(e){} },
  notify(title,body){ if(Native.send('notify',{title,body})) return; if(window.Notification){ if(Notification.permission==='granted') new Notification(title,{body}); else if(Notification.permission!=='denied') Notification.requestPermission().then(p=>{ if(p==='granted') new Notification(title,{body}); }); } toast(title+' · '+body,4000); },
  fmt(ms){ ms=Math.max(0,Math.round(ms/1000)*1000); const t=Math.round(ms/1000); const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); },
  render(){ const s=this.st; const full=$('#tfull'); const on=!!s;
    for(const ed of App.editors){ const g=ed.tgut; g.classList.toggle('on',on); if(!on) continue; const el=this.elapsed(), rem=this.remaining(); const total=s.kind==='stopwatch'?null:s.duration; const shown=s.kind==='stopwatch'?el:rem; const mm=Math.floor(shown/60000), ss=Math.floor(shown%60000/1000), hh=Math.floor(shown/3600000);
      const top=$('.tt',g), bot=$('.tb .tt',g), dots=$('.dots',g); top.textContent=s.kind==='stopwatch'?'⏱':(s.kind==='pomo'?(s.phase==='work'?'work':'rest'):(total>=3600000?Math.round(total/3600000)+'h':Math.round(total/60000)+'m')); top.title=s.title||''; bot.textContent=(hh?String(hh)+'\n':'')+String(mm).padStart(2,'0')+'\n'+String(ss).padStart(2,'0'); bot.classList.toggle('big',true);
      const H=dots.clientHeight||200; const n=Math.max(4,Math.floor(H/7)); if(dots.childElementCount!==n){ dots.innerHTML='<i></i>'.repeat(n); } const frac=s.kind==='stopwatch'?(el%60000)/60000:1-rem/total; [...dots.children].forEach((d,i)=>d.classList.toggle('on',i<Math.round(frac*n))); dots.classList.toggle('paused',s.paused); }
    if(on){ const shown=s.kind==='stopwatch'?this.elapsed():this.remaining(); $('.big',full).textContent=this.fmt(shown); $('.ttl',full).textContent=(s.title||'')+(s.kind==='pomo'?` · ${s.phase} · round ${s.cycle}`:'')+(s.paused?' · paused':''); $('.ring',full).style.width=(s.kind==='stopwatch'?(this.elapsed()%60000)/600:100-this.remaining()/s.duration*100)+'%';
      const mb=S.timerInMenuBar?(s.paused?'⏸ ':'')+this.fmt(shown):''; if(this._mb!==mb){ this._mb=mb; Native.send('menubarTimer',{text:mb}); } }
    App.renderBottom(); },

function makeZip(files){ const enc=new TextEncoder(); const crcT=(()=>{ const t=new Uint32Array(256); for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[i]=c>>>0; } return t; })(); const crc=b=>{ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=crcT[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
